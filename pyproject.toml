[project]
name = "cornac"
version = "0.1.0"
description = "A from-scratch, provider-agnostic LLM agent harness. The agent isn't the model — it's the harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "spv" }]
keywords = ["llm", "agent", "harness", "tool-use", "ollama", "anthropic"]

dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "ddgs>=0.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cornac = "cornac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cornac"]
